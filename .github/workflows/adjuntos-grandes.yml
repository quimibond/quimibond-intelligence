name: Adjuntos grandes

# Lee los adjuntos que la Edge Function attachments-extract salta por tamaño
# (too_large, pdf_too_large, sheet_too_large, cpu_limit). Ver
# scripts/adjuntos-grandes/extraer.py.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      gmail_message_ids:
        description: "Solo estos correos (ids de Gmail separados por coma)"
        required: false
      max_minutes:
        description: "Presupuesto de tiempo en minutos"
        required: false
        default: "25"
      dry_run:
        description: "1 = solo listar, no escribir"
        required: false
        default: "0"

concurrency:
  group: adjuntos-grandes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/adjuntos-grandes/requirements.txt
      - run: pip install -r scripts/adjuntos-grandes/requirements.txt
      - name: Extraer
        working-directory: scripts/adjuntos-grandes
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_MESSAGE_IDS: ${{ inputs.gmail_message_ids }}
          MAX_MINUTES: ${{ inputs.max_minutes || '25' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python extraer.py
